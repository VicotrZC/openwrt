name: Build OpenWrt 25.12 x86-64 PassWall

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             build-essential clang flex bison gawk gettext git             libncurses-dev libssl-dev python3 python3-setuptools             rsync unzip zlib1g-dev file wget

      - name: Clone OpenWrt 25.12
        run: |
          git clone --depth=1             --branch openwrt-25.12             https://github.com/openwrt/openwrt.git openwrt

      - name: Add PassWall feeds
        working-directory: openwrt
        run: |
          cat >> feeds.conf.default <<'EOF'
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          EOF

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure x86-64 Generic
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
          CONFIG_PACKAGE_xray-core=y
          EOF

          make defconfig

      - name: Download sources
        working-directory: openwrt
        run: |
          make -j$(nproc) download

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12-x86-64-passwall
          path: openwrt/bin/targets/x86/64/
          if-no-files-found: error
          retention-days: 7
