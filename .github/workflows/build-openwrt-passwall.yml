name: Build OpenWrt 25.12 x86-64 PassWall

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MAKE_JOBS: 2

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip zlib1g-dev file wget time procps

      - name: Clone OpenWrt 25.12
        run: |
          git clone --depth=1 \
            --branch openwrt-25.12 \
            https://github.com/openwrt/openwrt.git openwrt

      - name: Restore OpenWrt download cache
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-25.12-x86-64-passwall-dl-v2

      - name: Runner diagnostics
        run: |
          date -Is
          echo "=== CPU ==="
          nproc
          uname -a
          echo "=== MEMORY ==="
          free -h
          echo "=== DISK ==="
          df -h .
          echo "=== TOP PROCESSES ==="
          ps -eo pid,ppid,stat,%cpu,%mem,rss,etime,cmd --sort=-%mem | head -n 25 || true

      - name: Add PassWall feeds
        working-directory: openwrt
        run: |
          cat >> feeds.conf.default <<'EOF'
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall_luci https://github.com/Openwrt-Passwall/openwrt-passwall.git;main
          EOF

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure x86-64 Generic
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
          CONFIG_PACKAGE_xray-core=y
          EOF

          make defconfig

      - name: Download sources
        working-directory: openwrt
        run: |
          date -Is
          make -j"$MAKE_JOBS" download
          date -Is
          free -h
          df -h .

      - name: Build firmware with diagnostics
        working-directory: openwrt
        run: |
          set +e

          echo "=== BUILD START ==="
          date -Is
          echo "MAKE_JOBS=$MAKE_JOBS"
          nproc
          free -h
          df -h .

          (
            while true; do
              sleep 300
              echo "=== BUILD HEARTBEAT $(date -Is) ==="
              free -h
              df -h .
              ps -eo pid,ppid,stat,%cpu,%mem,rss,etime,cmd --sort=-%mem | head -n 25 || true
              echo "=== LAST 40 BUILD LOG LINES ==="
              tail -n 40 build.log || true
            done
          ) &
          monitor_pid=$!

          /usr/bin/time -v timeout --kill-after=5m 330m \
            make -j"$MAKE_JOBS" V=s > build.log 2>&1
          build_rc=$?

          kill "$monitor_pid" 2>/dev/null || true
          wait "$monitor_pid" 2>/dev/null || true

          echo "=== BUILD EXIT CODE: $build_rc ==="
          date -Is
          free -h
          df -h .
          echo "=== FINAL 200 BUILD LOG LINES ==="
          tail -n 200 build.log || true
          exit "$build_rc"

      - name: Collect diagnostics
        if: always()
        working-directory: openwrt
        run: |
          {
            echo "=== POST BUILD DIAGNOSTICS ==="
            date -Is
            echo "=== CPU ==="
            nproc
            echo "=== MEMORY ==="
            free -h
            echo "=== DISK ==="
            df -h .
            echo "=== TOP PROCESSES ==="
            ps -eo pid,ppid,stat,%cpu,%mem,rss,etime,cmd --sort=-%mem | head -n 25 || true
          } | tee post-build-diagnostics.txt

      - name: Upload logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-build-logs-and-diagnostics
          path: |
            openwrt/build.log
            openwrt/post-build-diagnostics.txt
            openwrt/.config
          if-no-files-found: warn
          retention-days: 7

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12-x86-64-passwall
          path: openwrt/bin/targets/x86/64/
          if-no-files-found: error
          retention-days: 7
